<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI yemot — עדכון שלוחות חכם</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Assistant', 'Inter', 'sans-serif'],
            }
          }
        }
      }
    </script>
    <style>
      body {
        font-family: 'Assistant', 'Inter', sans-serif;
        background-color: #f8fafc;
        color: #0f172a;
        margin: 0;
        padding: 0;
        overflow-x: hidden;
      }
      /* Custom smooth scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f5f9;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }

      /* Knowledge Explorer Markdown styling */
      .knowledge-prose {
        line-height: 1.7;
        color: #1e293b;
      }
      .knowledge-prose h1 {
        font-size: 1.25rem;
        font-weight: 800;
        color: #0f172a;
        border-bottom: 2px solid #e2e8f0;
        padding-bottom: 0.4rem;
        margin-top: 1.5rem;
        margin-bottom: 0.8rem;
      }
      .knowledge-prose h2 {
        font-size: 1.05rem;
        font-weight: 700;
        color: #1e293b;
        border-bottom: 1px solid #e2e8f0;
        padding-bottom: 0.3rem;
        margin-top: 1.25rem;
        margin-bottom: 0.6rem;
      }
      .knowledge-prose h3 {
        font-size: 0.95rem;
        font-weight: 700;
        color: #334155;
        margin-top: 1rem;
        margin-bottom: 0.4rem;
      }
      .knowledge-prose h4 {
        font-size: 0.85rem;
        font-weight: 600;
        color: #475569;
        margin-top: 0.8rem;
        margin-bottom: 0.3rem;
      }
      .knowledge-prose p {
        margin-bottom: 0.65rem;
      }
      .knowledge-prose strong {
        font-weight: 700;
        color: #0f172a;
      }
      .knowledge-prose ul {
        list-style-type: disc;
        padding-inline-start: 1.25rem;
        margin-bottom: 0.65rem;
      }
      .knowledge-prose ol {
        list-style-type: decimal;
        padding-inline-start: 1.25rem;
        margin-bottom: 0.65rem;
      }
      .knowledge-prose li {
        margin-bottom: 0.25rem;
      }
      .knowledge-prose pre {
        background-color: #0f172a;
        color: #f8fafc;
        padding: 0.75rem 1rem;
        border-radius: 0.75rem;
        font-size: 0.75rem;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        overflow-x: auto;
        direction: ltr;
        text-align: left;
        margin: 0.75rem 0;
        border: 1px solid #334155;
      }
      .knowledge-prose code {
        background-color: #f1f5f9;
        color: #4338ca;
        padding: 0.15rem 0.35rem;
        border-radius: 0.35rem;
        font-size: 0.75rem;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        border: 1px solid #e2e8f0;
      }
      .knowledge-prose pre code {
        background-color: transparent;
        color: inherit;
        padding: 0;
        border: none;
      }
      .knowledge-prose a {
        color: #2563eb;
        text-decoration: underline;
        text-underline-offset: 2px;
        font-weight: 500;
        cursor: pointer;
        transition: color 0.15s;
      }
      .knowledge-prose a:hover {
        color: #1d4ed8;
      }
      .knowledge-prose table {
        width: 100%;
        border-collapse: collapse;
        margin: 0.75rem 0;
        font-size: 0.75rem;
      }
      .knowledge-prose th {
        background-color: #f1f5f9;
        border: 1px solid #cbd5e1;
        padding: 0.4rem 0.6rem;
        font-weight: 700;
        text-align: right;
      }
      .knowledge-prose td {
        border: 1px solid #cbd5e1;
        padding: 0.4rem 0.6rem;
      }
      .knowledge-prose tr:nth-child(even) td {
        background-color: #f8fafc;
      }
      .knowledge-prose blockquote {
        border-inline-start: 4px solid #3b82f6;
        background-color: #eff6ff;
        padding: 0.4rem 0.75rem;
        margin: 0.5rem 0;
        border-radius: 0.35rem;
        color: #1e3a8a;
      }
      .knowledge-prose hr {
        border: none;
        border-top: 1px solid #e2e8f0;
        margin: 1rem 0;
      }
      @keyframes target-pulse {
        0% { background-color: rgba(254, 240, 138, 0.9); }
        50% { background-color: rgba(254, 240, 138, 0.4); }
        100% { background-color: transparent; }
      }
      .target-highlight {
        animation: target-pulse 2.5s ease-out;
        border-radius: 0.35rem;
      }
    </style>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
