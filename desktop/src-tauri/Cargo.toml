[package]
name = "desktop"
version = "1.0.0"
description = "AI yemot — עורך קווי ימות המשיח מבוסס AI"
authors = ["Bot-phone"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `stream` is what gives `bytes_stream()` — the SSE reader in agent/providers.
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
tokio = { version = "1", features = ["time", "sync", "macros", "rt", "rt-multi-thread"] }
include_dir = "0.7"
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }

# --- knowledge index (build.rs BM25) --------------------------------------
# No additional crates required: the index is serialized by build.rs in a
# hand-rolled varint format and read back with std only.
# --------------------------------------------------------------------------

# --- agent loop (src/agent/**) --------------------------------------------
# async-trait : `trait Provider { async fn complete(..) }` without hand-rolled
#               Pin<Box<dyn Future>> signatures.
# futures-util: `future::join_all` — read-only tools of one turn run in parallel.
# tokio-util  : `CancellationToken` — cancel between turns / mutating writes.
async-trait = "0.1"
futures-util = { version = "0.3", default-features = false, features = ["alloc", "std"] }
tokio-util = "0.7"
# --------------------------------------------------------------------------

# Release profile: smaller, faster binary. `panic = "abort"` is safe here —
# no `catch_unwind` and no thread whose panic must be recovered.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
