[package]
name = "desktop"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
include_dir = "0.7"
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }

# --- knowledge index (build.rs BM25) --------------------------------------
# No additional crates required: the index is serialized by build.rs in a
# hand-rolled varint format and read back with std only.
# --------------------------------------------------------------------------

# --- agent loop (src/agent/**) --------------------------------------------
# async-trait : `trait Provider { async fn complete(..) }` without hand-rolled
#               Pin<Box<dyn Future>> signatures.
# futures     : `future::join_all` — read-only tools of one turn run in parallel.
# tokio-util  : `CancellationToken` — cancel between turns / mutating writes.
async-trait = "0.1"
futures = "0.3"
tokio-util = "0.7"
# --------------------------------------------------------------------------
