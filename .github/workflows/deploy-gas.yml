name: Deploy Script (Apps Script)

# פורס את gas/ai_yemot.gs לפרויקט ה-Apps Script בכל שינוי בו, ומעדכן את
# ה-deployment הקיים — כלומר אותה כתובת /exec, בלי "New version" ידני.
# ההרצה ידנית בלבד: הסקריפט הוא מורשת קפואה, האפליקציה השולחנית היא
# המסלול העיקרי. אין פריסה אוטומטית על דחיפה ל-gas/.
on:
  workflow_dispatch:
    inputs:
      force:
        description: 'עקיפת שער בטיחות (דריסה ללא חתימה מקדימה)'
        required: false
        default: false
        type: boolean

# שתי ריצות במקביל היו דוחפות שתי גרסאות לאותו פרויקט
concurrency:
  group: apps-script-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      # שגיאת-תחביר מגיעה כאן ישר ל-/exec החי: הפריסה אוטומטית בכל דחיפה.
      # node --check עוצר אותה לפני clasp push.
      - name: בדיקת תחביר
        # node דוחה סיומת .gs (ERR_UNKNOWN_FILE_EXTENSION) — מעתיקים ל-.js.
        run: cp gas/ai_yemot.gs /tmp/gas_check.js && node --check /tmp/gas_check.js

      - name: Push and deploy
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          GAS_SCRIPT_ID: ${{ secrets.GAS_SCRIPT_ID }}
          GAS_DEPLOYMENT_ID: ${{ secrets.GAS_DEPLOYMENT_ID }}
          ALLOW_UNSAFE_OVERWRITE: ${{ inputs.force || 'false' }}
        run: bash gas/deploy_gas.sh

      # המצב המרוחק שהיה לפני הדריסה — גיבוי למקרה חירום. נשמר כתוצר רק
      # כשהריצה נכשלה, ולזמן קצר: זה תוכן חי של הסקריפט המרוחק, ואין סיבה
      # להשאיר אותו מונח כברירת מחדל ל-30 יום כשהפריסה הצליחה.
      - name: Backup of remote state
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gas-remote-backup
          path: remote_backup
          retention-days: 1
          if-no-files-found: ignore