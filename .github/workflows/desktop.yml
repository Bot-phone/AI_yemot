name: Desktop

# בדיקות על כל PR ודחיפה ל-main, ובנייה + שחרור על תגית v*.
# ה-release הוא מה שבודק המעדכן בתוך האפליקציה (releases/latest).
on:
  pull_request:
    paths:
      - 'desktop/**'
      - 'knowledge/**'
      - '.github/workflows/desktop.yml'
  # בלי מסנן paths: מסנן כזה חל גם על דחיפת תגית ועלול לחסום שחרור
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # החבילות ש-Tauri 2 דורש כדי לקמפל על אובונטו
      - name: Ubuntu system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libayatana-appindicator3-dev \
            libgtk-3-dev

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            desktop/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Rust tests
        working-directory: desktop/src-tauri
        run: cargo test --lib

      - name: Rust lint
        working-directory: desktop/src-tauri
        run: cargo clippy --lib -- -D warnings

      - name: Frontend install
        working-directory: desktop
        run: npm ci

      - name: Frontend check
        working-directory: desktop
        run: npm run check

      - name: Frontend build
        working-directory: desktop
        run: npm run build

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: '--bundles nsis,msi'
          - platform: macos-latest
            args: '--bundles dmg,app'
          - platform: ubuntu-22.04
            args: '--bundles appimage,deb'
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Ubuntu system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libayatana-appindicator3-dev \
            libgtk-3-dev

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            desktop/src-tauri/target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Frontend install
        working-directory: desktop
        run: npm ci

      # Release body: download links for every installer, then the Hebrew usage
      # guide (desktop/RELEASE_GUIDE.md) and the version's CHANGELOG section,
      # composed by .github/release-notes.sh.
      - name: Release notes
        id: notes
        shell: bash
        run: |
          {
            echo "body<<NOTES_EOF"
            .github/release-notes.sh "${GITHUB_REF_NAME#v}"
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing: every bundle gets a minisign signature and the
          # action publishes latest.json, which the app's updater plugin reads.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          projectPath: desktop
          tagName: v__VERSION__
          releaseName: 'AI yemot v__VERSION__'
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
