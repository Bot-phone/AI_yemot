name: סנכרון תיעוד ימות המשיח

on:
  schedule:
    # ריצה אוטומטית פעם בשבוע: בכל יום ראשון ב-03:00 בלילה (UTC)
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      force:
        description: 'עדכון כל הקבצים בכוח (עקיפת בדיקת שינויים)'
        required: false
        default: false
        type: boolean
      dry_run:
        description: 'הרצת בדיקה בלבד (ללא שמירה וללא commit)'
        required: false
        default: false
        type: boolean

concurrency:
  group: sync-yemot-docs
  cancel-in-progress: true

jobs:
  sync-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scraper/requirements.txt

      - name: Run documentation scraper
        env:
          GAS_WEBAPP_URL: ${{ secrets.GAS_WEBAPP_URL != '' && secrets.GAS_WEBAPP_URL || (secrets.GAS_DEPLOYMENT_ID != '' && format('https://script.google.com/macros/s/{0}/exec', secrets.GAS_DEPLOYMENT_ID) || '') }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET != '' && secrets.ADMIN_SECRET || 'yemot_admin_secret' }}
        run: |
          EXTRA_ARGS=""
          if [ "${{ inputs.force }}" = "true" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --force"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --dry-run"
          fi
          python scraper/sync_docs.py $EXTRA_ARGS

      - name: Commit and push changes
        if: inputs.dry_run != true
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # בדיקה אם נוספו או שונו קבצים בתיקיית knowledge או במטמון
          if [ -n "$(git status --porcelain knowledge/ scraper/redirect_cache.json)" ]; then
            echo "זוהו שינויים בקובצי התיעוד. מבצע commit ו-push..."
            git add knowledge/ scraper/redirect_cache.json
            git commit -m "סנכרון שבועי אוטומטי של תיעוד ימות המשיח [skip ci]"
            git push
            echo "קובצי התיעוד נדחפו בהצלחה למאגר!"
          else
            echo "לא זוהו שינויים חדשים בקובצי התיעוד."
          fi
